name: Compilar Firmware Xiaozhi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar con ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          command: idf.py build

      - name: Subir binario compilado (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-waveshare-2.16-firmware
          path: build/*.bin
