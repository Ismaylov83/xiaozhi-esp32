name: Compilar Firmware Xiaozhi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Configurar ESP-IDF v6.0.1
        run: |
          git clone -b release-v6.0.1 --depth 1 https://github.com/espressif/esp-idf.git $HOME/esp/esp-idf
          cd $HOME/esp/esp-idf
          ./install.sh esp32s3

      - name: Compilar Firmware
        run: |
          . $HOME/esp/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Subir binario compilado (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-waveshare-2.16-firmware
          path: build/*.bin
