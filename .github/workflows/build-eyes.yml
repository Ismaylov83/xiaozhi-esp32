name: Build firmware ojos robot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar tu código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Instalar ESP-IDF v6.0.1
        run: |
          git clone -b v6.0.1 --depth 1 --recursive --shallow-submodules \
            https://github.com/espressif/esp-idf.git $HOME/esp/esp-idf
          cd $HOME/esp/esp-idf
          ./install.sh esp32s3

      - name: Compilar firmware (Waveshare ESP32-S3 AMOLED 2.16)
        run: |
          . $HOME/esp/esp-idf/export.sh
          python scripts/build.py waveshare/esp32-s3-touch-amoled-2.16

      - name: Guardar el firmware compilado
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3-amoled-2.16
          path: build/merged-binary.bin
          if-no-files-found: error
